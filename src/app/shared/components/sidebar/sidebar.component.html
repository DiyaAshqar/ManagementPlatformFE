<!-- Sidebar Navigation -->
<nav 
  class="sidebar" 
  [class.mobile-open]="sidebarService.isMobileOpen()"
  [class.collapsed]="!sidebarService.isOpen()">
  
  <!-- Logo Section -->
  <div class="sidebar-header">
    <div class="flex align-items-center gap-3 cursor-pointer" *ngIf="sidebarService.isOpen()" (click)="goHome()">
      <img [src]="logoPath" alt="Logo" class="sidebar-logo">
    </div>
    <div class="flex align-items-center justify-content-center cursor-pointer" *ngIf="!sidebarService.isOpen()" (click)="goHome()">
      <img [src]="logoPath" alt="Logo" class="sidebar-logo-collapsed">
    </div>
  </div>

  <!-- Navigation Sections -->
  <div class="sidebar-content">
    <div class="nav-sections">
      @for (module of navModules; track module.key) {
        @if (visibleItems(module).length) {
          <div class="nav-module" [class.expanded]="isModuleExpanded(module) || !sidebarService.isOpen()">
            <button
              type="button"
              class="module-header"
              [class.has-active]="isModuleActive(module)"
              (click)="toggleModule(module)"
              [attr.aria-expanded]="isModuleExpanded(module)"
              [attr.aria-label]="module.title | translate"
              [pTooltip]="!sidebarService.isOpen() ? (module.title | translate) : ''"
              tooltipPosition="right">
              <i [class]="module.icon + ' module-icon'"></i>
              @if (sidebarService.isOpen()) {
                <span class="module-label">{{ module.title | translate }}</span>
                <i class="pi pi-chevron-down module-chevron"></i>
              }
            </button>

            <div class="module-body">
              <div class="nav-items">
                @for (item of visibleItems(module); track item.label) {
                  <a
                    class="nav-item"
                    [class.active]="isActiveRoute(item.route)"
                    (click)="navigateTo(item.route)"
                    [attr.aria-label]="item.label | translate"
                    [pTooltip]="!sidebarService.isOpen() ? (item.label | translate) : ''"
                    tooltipPosition="right">
                    <i [class]="item.icon + ' nav-icon'"></i>
                    @if (sidebarService.isOpen()) {
                      <span class="nav-label">{{ item.label | translate }}</span>
                    }
                  </a>
                }
              </div>
            </div>
          </div>
        }
      }
    </div>
  </div>

  <!-- Footer Navigation -->
  <div class="sidebar-footer">
    <div
      class="deployment-info"
      [pTooltip]="!sidebarService.isOpen() ? deploymentStatus : ''"
      tooltipPosition="right">
      <i class="pi pi-cloud-upload deployment-icon"></i>
      <span class="deployment-label" *ngIf="sidebarService.isOpen()">{{ deploymentStatus }}</span>
    </div>
    <div class="nav-items">
      <a 
        *ngFor="let item of footerItems"
        class="nav-item"
        [class.active]="isActiveRoute(item.route)"
        (click)="navigateTo(item.route)"
        [attr.aria-label]="item.label | translate"
        [pTooltip]="!sidebarService.isOpen() ? (item.label | translate) : ''"
        tooltipPosition="right">
        <i [class]="item.icon + ' nav-icon'"></i>
        <span class="nav-label" *ngIf="sidebarService.isOpen()">{{ item.label | translate }}</span>
      </a>
    </div>
  </div>
</nav>

<!-- Mobile Overlay -->
<div 
  *ngIf="sidebarService.isMobileOpen()"
  class="sidebar-overlay lg:hidden"
  (click)="closeMobileMenu()">
</div>
