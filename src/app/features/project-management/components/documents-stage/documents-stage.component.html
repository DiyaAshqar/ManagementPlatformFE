<p-card>
  <ng-template pTemplate="header">
    <div class="px-4 pt-4">
      <h3 class="text-xl font-semibold m-0 text-color">Documents</h3>
      <p class="text-sm text-500 mt-1 mb-0">Upload and manage project documents</p>
    </div>
  </ng-template>

  <ng-template pTemplate="content">
    <app-documents-table
      [attachmentType]="attachmentType"
      [relationshipId]="relationshipId"
      contextLabel="this project">
    </app-documents-table>
  </ng-template>
</p-card>
