<div class="milestone-stage">

  <!-- ── Page Header ───────────────────────────────────────────────────── -->
  <div class="ms-header mb-4">
    <h2 class="ms-title">Milestone: Phase 1 – Foundation Work</h2>
    <p class="ms-subtitle">Manage all aspects of this milestone</p>
  </div>

  <!-- ── Tabs ─────────────────────────────────────────────────────────── -->
  <p-tabs [(value)]="activeTab">
    <p-tablist>
      <p-tab value="0">Bill of Quantities</p-tab>
      <p-tab value="1">Purchase Orders</p-tab>
      <p-tab value="2">Surveying Visits</p-tab>
      <p-tab value="3">Voucher Orders</p-tab>
      <p-tab value="4">Documents</p-tab>
    </p-tablist>

    <p-tabpanels>

      <p-tabpanel value="0">
        <app-boq-tab [projectStageId]="projectStageId" class="block mt-3"></app-boq-tab>
      </p-tabpanel>

      <p-tabpanel value="1">
        <app-purchase-orders-tab [projectStageId]="projectStageId"></app-purchase-orders-tab>
      </p-tabpanel>

      <p-tabpanel value="2">
        <app-surveying-visits-tab [projectStageId]="projectStageId"></app-surveying-visits-tab>
      </p-tabpanel>

      <p-tabpanel value="3">
        <app-voucher-orders-tab [projectStageId]="projectStageId"></app-voucher-orders-tab>
      </p-tabpanel>

      <p-tabpanel value="4">
        <app-milestone-documents-tab [projectStageId]="projectStageId"></app-milestone-documents-tab>
      </p-tabpanel>

    </p-tabpanels>
  </p-tabs>

</div>
