<div class="flex flex-column gap-3 p-3">
    <div>
      <label for="item-title" class="block text-sm font-medium mb-2">Title *</label>
      <input 
        id="item-title"
        type="text" 
        pInputText 
        [ngModel]="currentFormData.title"
        (ngModelChange)="updateFormField('title', $event)"
        placeholder="Foundation Excavation - Phase 1"
        class="w-full">
    </div>
    
    <div class="grid">
      <div class="col-6">
        <label for="item-type" class="block text-sm font-medium mb-2">Type</label>
        <p-select 
          id="item-type"
          [ngModel]="currentFormData.type"
          (ngModelChange)="onTaskTypeChange($event)"
          [options]="workItemTypes"
          optionLabel="label"
          optionValue="value"
          placeholder="Select type"
          [loading]="isLoadingTaskTypes()"
          styleClass="w-full">
        </p-select>
      </div>
      <div class="col-6">
        <label for="item-assignTo" class="block text-sm font-medium mb-2">Assign To</label>
        <input 
          id="item-assignTo"
          type="text" 
          pInputText 
          [ngModel]="currentFormData.assignTo"
          (ngModelChange)="updateFormField('assignTo', $event)"
          placeholder="Mike Johnson"
          class="w-full">
      </div>
    </div>
    
    <div class="grid">
      <div class="col-6">
        <label for="item-start-date" class="block text-sm font-medium mb-2">Start Date</label>
        <p-datepicker 
          id="item-start-date"
          [ngModel]="currentFormData.startDate"
          (ngModelChange)="updateFormField('startDate', $event)"
          dateFormat="mm/dd/yy"
          [showIcon]="true"
          [showButtonBar]="true"
          placeholder="mm/dd/yyyy"
          styleClass="w-full">
        </p-datepicker>
      </div>
      <div class="col-6">
        <label for="item-end-date" class="block text-sm font-medium mb-2">End Date</label>
        <p-datepicker 
          id="item-end-date"
          [ngModel]="currentFormData.endDate"
          (ngModelChange)="updateFormField('endDate', $event)"
          dateFormat="mm/dd/yy"
          [showIcon]="true"
          [showButtonBar]="true"
          placeholder="mm/dd/yyyy"
          styleClass="w-full">
        </p-datepicker>
      </div>
    </div>
    
    <div class="grid">
      <div class="col-6">
        <label for="item-priority" class="block text-sm font-medium mb-2">Priority</label>
        <p-select 
          id="item-priority"
          [ngModel]="currentFormData.priority"
          (ngModelChange)="updateFormField('priority', $event)"
          [options]="priorityOptions"
          optionLabel="label"
          optionValue="value"
          placeholder="Select priority"
          styleClass="w-full">
        </p-select>
      </div>
      <div class="col-6">
        <label for="item-task-points" class="block text-sm font-medium mb-2">Task Points</label>
        <input 
          id="item-task-points"
          type="text" 
          pInputText 
          [ngModel]="currentFormData.taskPoints"
          (ngModelChange)="updateFormField('taskPoints', $event)"
          placeholder="8"
          class="w-full">
      </div>
    </div>
    
    <div class="grid">
      <div class="col-6">
        <label for="item-location" class="block text-sm font-medium mb-2">Location</label>
        <input 
          id="item-location"
          type="text" 
          pInputText 
          [ngModel]="currentFormData.location"
          (ngModelChange)="updateFormField('location', $event)"
          placeholder="Grid A1-A5"
          class="w-full">
      </div>
      <div class="col-6">
        <label for="item-depth" class="block text-sm font-medium mb-2">Depth</label>
        <input 
          id="item-depth"
          type="text" 
          pInputText 
          [ngModel]="currentFormData.depth"
          (ngModelChange)="updateFormField('depth', $event)"
          placeholder="3.5m"
          class="w-full">
      </div>
    </div>
    
    <div class="grid">
      <div class="col-6">
        <label for="item-volume" class="block text-sm font-medium mb-2">Volume</label>
        <input 
          id="item-volume"
          type="text" 
          pInputText 
          [ngModel]="currentFormData.volume"
          (ngModelChange)="updateFormField('volume', $event)"
          placeholder="450 m³"
          class="w-full">
      </div>
      <div class="col-6">
        <label for="item-soil-type" class="block text-sm font-medium mb-2">Soil Type</label>
        <input 
          id="item-soil-type"
          type="text" 
          pInputText 
          [ngModel]="currentFormData.soilType"
          (ngModelChange)="updateFormField('soilType', $event)"
          placeholder="Clay"
          class="w-full">
      </div>
    </div>
    
    <div>
      <label for="item-equipment" class="block text-sm font-medium mb-2">Equipment</label>
      <input 
        id="item-equipment"
        type="text" 
        pInputText 
        [ngModel]="currentFormData.equipment"
        (ngModelChange)="updateFormField('equipment', $event)"
        placeholder="Excavator CAT 320"
        class="w-full">
    </div>
    
    <div>
      <label for="item-description" class="block text-sm font-medium mb-2">Description</label>
      <textarea 
        id="item-description"
        pTextarea
        [ngModel]="currentFormData.description"
        (ngModelChange)="updateFormField('description', $event)"
        placeholder="Describe the excavation task..."
        [rows]="3"
        class="w-full">
      </textarea>
    </div>

    <!-- Subtasks Section -->
    <div class="border-top-1 surface-border pt-3">
      <div class="flex align-items-center justify-content-between mb-3">
        <label class="text-sm font-semibold m-0 text-color">
          Subtasks ({{ subtasks().length }})
        </label>
        <p-button 
          label="Add Subtask"
          icon="pi pi-plus"
          size="small"
          [outlined]="true"
          (onClick)="openAddSubtaskDialog()">
        </p-button>
      </div>

      @if (subtasks().length > 0) {
        <div class="border-round border-1 surface-border overflow-hidden">
          <p-table [value]="subtasks()" styleClass="p-datatable-sm">
            <ng-template pTemplate="header">
              <tr>
                <th style="width: 25%">Title</th>
                <th style="width: 20%">Dates</th>
                <th style="width: 15%">Type</th>
                <th style="width: 15%">Status</th>
                <th style="width: 10%">Cost</th>
                <th style="width: 10%">Quantity</th>
                <th style="width: 5%" class="text-center">Actions</th>
              </tr>
            </ng-template>
            <ng-template pTemplate="body" let-subtask>
              <tr>
                <td>{{ subtask.title }}</td>
                <td class="text-xs">
                  <div>{{ subtask.startDate }}</div>
                  <div>{{ subtask.endDate }}</div>
                </td>
                <td>{{ subtask.type }}</td>
                <td>
                  <p-tag 
                    [value]="getStatusLabel(subtask.status)"
                    [severity]="getStatusSeverity(subtask.status)"
                    styleClass="text-xs">
                  </p-tag>
                </td>
                <td>{{ subtask.cost }}</td>
                <td>{{ subtask.quantity }}</td>
                <td class="text-center">
                  <div class="flex align-items-center justify-content-center gap-1">
                    <p-button
                      icon="pi pi-pencil"
                      [text]="true"
                      [rounded]="true"
                      size="small"
                      severity="secondary"
                      (onClick)="openEditSubtaskDialog(subtask)"
                      pTooltip="Edit"
                      tooltipPosition="top">
                    </p-button>
                    <p-button
                      icon="pi pi-trash"
                      [text]="true"
                      [rounded]="true"
                      size="small"
                      severity="danger"
                      (onClick)="deleteSubtask(subtask.id)"
                      pTooltip="Delete"
                      tooltipPosition="top">
                    </p-button>
                  </div>
                </td>
              </tr>
            </ng-template>
          </p-table>
        </div>
      } @else {
        <div class="text-center p-3 surface-50 border-round border-1 surface-border">
          <i class="pi pi-list text-2xl text-400 mb-2"></i>
          <p class="text-xs text-500 m-0">No subtasks yet. Click "Add Subtask" to create one.</p>
        </div>
      }
    </div>

    <!-- Footer -->
    <div class="flex justify-content-end gap-2 border-top-1 surface-border pt-3">
      <p-button 
        label="Cancel"
        [outlined]="true"
        (onClick)="onCancel()">
      </p-button>
      <p-button 
        label="Save"
        (onClick)="onSave()">
      </p-button>
    </div>
  </div>
