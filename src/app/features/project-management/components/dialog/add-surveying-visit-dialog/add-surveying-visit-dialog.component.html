<p-dialog
  [(visible)]="visible"
  (onHide)="onHide()"
  [header]="dialogHeader"
  [modal]="true"
  [closable]="true"
  [dismissableMask]="true"
  [style]="{ width: '44rem' }"
  [breakpoints]="{ '960px': '75vw', '640px': '95vw' }">

  <form [formGroup]="visitForm" (ngSubmit)="onSubmit()">
    <div class="grid">

      <!-- Visit Date -->
      <div class="col-12 md:col-6">
        <div class="field">
          <p-floatlabel variant="in">
            <p-datepicker
              inputId="visitDate"
              formControlName="visitDate"
              [showIcon]="true"
              dateFormat="yy-mm-dd"
              [showButtonBar]="true"
              class="w-full"
              appendTo="body"
              [class.ng-invalid]="isFieldInvalid('visitDate')">
            </p-datepicker>
            <label for="visitDate">Visit Date *</label>
          </p-floatlabel>
          <small *ngIf="isFieldInvalid('visitDate')" class="p-error">Visit date is required.</small>
        </div>
      </div>

      <!-- Surveyor -->
      <div class="col-12 md:col-6">
        <div class="field">
          <p-floatlabel variant="in">
            <input
              pInputText
              id="surveyor"
              formControlName="surveyor"
              class="w-full"
              [class.ng-invalid]="isFieldInvalid('surveyor')" />
            <label for="surveyor">Surveyor *</label>
          </p-floatlabel>
          <small *ngIf="isFieldInvalid('surveyor')" class="p-error">Surveyor is required.</small>
        </div>
      </div>

      <!-- Purpose -->
      <div class="col-12">
        <div class="field">
          <p-floatlabel variant="in">
            <textarea
              pTextarea
              id="purpose"
              formControlName="purpose"
              rows="2"
              class="w-full"
              [class.ng-invalid]="isFieldInvalid('purpose')">
            </textarea>
            <label for="purpose">Purpose *</label>
          </p-floatlabel>
          <small *ngIf="isFieldInvalid('purpose')" class="p-error">Purpose is required.</small>
        </div>
      </div>

      <!-- Unit -->
      <div class="col-12 md:col-6">
        <div class="field">
          <p-floatlabel variant="in">
            <p-select
              inputId="unitId"
              formControlName="unitId"
              [options]="unitOptions"
              optionLabel="label"
              optionValue="value"
              [showClear]="true"
              class="w-full"
              appendTo="body"
              [class.ng-invalid]="isFieldInvalid('unitId')">
            </p-select>
            <label for="unitId">Unit *</label>
          </p-floatlabel>
          <small *ngIf="isFieldInvalid('unitId')" class="p-error">Unit is required.</small>
        </div>
      </div>

      <!-- Quantity -->
      <div class="col-12 md:col-6">
        <div class="field">
          <p-floatlabel variant="in">
            <p-inputnumber
              inputId="quantity"
              formControlName="quantity"
              [minFractionDigits]="0"
              [maxFractionDigits]="4"
              [min]="0"
              class="w-full"
              [class.ng-invalid]="isFieldInvalid('quantity')">
            </p-inputnumber>
            <label for="quantity">Quantity *</label>
          </p-floatlabel>
          <small *ngIf="isFieldInvalid('quantity')" class="p-error">Quantity is required.</small>
        </div>
      </div>

      <!-- Unit Price -->
      <div class="col-12">
        <div class="field">
          <p-floatlabel variant="in">
            <p-inputnumber
              inputId="price"
              formControlName="price"
              mode="currency"
              currency="USD"
              [minFractionDigits]="2"
              [maxFractionDigits]="2"
              [min]="0"
              class="w-full"
              [class.ng-invalid]="isFieldInvalid('price')">
            </p-inputnumber>
            <label for="price">Unit Price *</label>
          </p-floatlabel>
          <small *ngIf="isFieldInvalid('price')" class="p-error">Unit price is required.</small>
        </div>
      </div>

      <!-- Status -->
      <div class="col-12 md:col-6">
        <div class="field">
          <p-floatlabel variant="in">
            <p-select
              inputId="status"
              formControlName="status"
              [options]="statusOptions"
              optionLabel="label"
              optionValue="value"
              class="w-full"
              appendTo="body"
              [class.ng-invalid]="isFieldInvalid('status')">
            </p-select>
            <label for="status">Status *</label>
          </p-floatlabel>
          <small *ngIf="isFieldInvalid('status')" class="p-error">Status is required.</small>
        </div>
      </div>

      <!-- Subtotal preview -->
      <div class="col-12">
        <div class="sv-subtotal-preview">
          <span class="label">Subtotal:</span>
          <span class="value">{{ computedSubTotal | currency:'USD':'symbol':'1.2-2' }}</span>
        </div>
      </div>

    </div>
  </form>

  <ng-template pTemplate="footer">
    <p-button
      label="Cancel"
      icon="pi pi-times"
      (onClick)="onHide()"
      severity="secondary"
      [outlined]="true">
    </p-button>
    <p-button
      [label]="isEditMode ? 'Update' : 'Schedule Visit'"
      icon="pi pi-check"
      (onClick)="onSubmit()"
      [loading]="isSubmitting()"
      [disabled]="visitForm.invalid">
    </p-button>
  </ng-template>
</p-dialog>
