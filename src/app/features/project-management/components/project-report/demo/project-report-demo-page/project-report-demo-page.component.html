<div class="demo-page p-3" dir="rtl">
  <p-card>
    <ng-template pTemplate="title">تقرير المشروع</ng-template>
    <ng-template pTemplate="subtitle">
      بيانات التقرير تُحمّل مباشرة من الخادم للمشروع 4 والمرحلة 9.
    </ng-template>

    @if (loadError(); as error) {
      <p class="text-red-500 mt-2">{{ error }}</p>
    }

    <div class="demo-grid">
<div class="field-block">
        <label class="block text-sm font-medium mb-2">لغة التقرير</label>
        <p-select
          [(ngModel)]="selectedLanguage"
          [options]="languageOptions"
          optionLabel="label"
          optionValue="value"
          styleClass="w-full"
          (onChange)="refresh()">
        </p-select>
      </div>

      <div class="field-block">
        <label class="block text-sm font-medium mb-2">مرحلة الإنجاز (Milestone Stage)</label>
        <p-select
          [(ngModel)]="selectedStageId"
          [options]="stageOptions"
          optionLabel="label"
          optionValue="value"
          styleClass="w-full"
          (onChange)="refresh()">
        </p-select>
      </div>
    </div>
<div class="toggle-grid mt-3">
      <div class="toggle-item">
        <p-checkbox [(ngModel)]="includeCompanyHeader" [binary]="true" inputId="demoCompanyHeader" (onChange)="refresh()"></p-checkbox>
        <label for="demoCompanyHeader">تضمين ترويسة الشركة والشعار</label>
      </div>
      <div class="toggle-item">
        <p-checkbox [(ngModel)]="includeSignatures" [binary]="true" inputId="demoSignatures" (onChange)="refresh()"></p-checkbox>
        <label for="demoSignatures">تضمين التوقيعات</label>
      </div>
      <div class="toggle-item">
        <p-checkbox [(ngModel)]="includePercentageFees" [binary]="true" inputId="demoPercentageFees" (onChange)="refresh()"></p-checkbox>
        <label for="demoPercentageFees">إظهار نسبة الأتعاب</label>
      </div>
      <div class="toggle-item">
        <p-checkbox [(ngModel)]="confidential" [binary]="true" inputId="demoConfidential" (onChange)="refresh()"></p-checkbox>
        <label for="demoConfidential">تصنيف كوثيقة سرية</label>
      </div>
    </div>

    <div class="actions mt-3">
      <p-button label="تحديث المعاينة" icon="pi pi-refresh" [outlined]="true" [loading]="isRendering()" (onClick)="refresh()"></p-button>
      <p-button label="طباعة" icon="pi pi-print" (onClick)="print()"></p-button>
    </div>
  </p-card>

  <p-card styleClass="mt-3">
    <ng-template pTemplate="title">اختر أقسام البيانات المطلوب تضمينها</ng-template>
    <div class="data-type-grid">
      @for (card of dataTypeCards; track card.key) {
        <button
          type="button"
          class="data-type-card"
          [class.selected]="isCardSelected(card.key)"
          (click)="toggleCard(card.key)">
          <span class="data-type-icon" [style.background]="card.color + '26'" [style.color]="card.color">
            <i class="pi" [class]="card.icon"></i>
          </span>
          <span class="data-type-badge">{{ card.badge }}</span>
          <span class="data-type-subtitle">{{ card.subtitleAr }}</span>
          <span class="data-type-description">{{ card.descriptionAr }}</span>
        </button>
      }
    </div>
  </p-card>

  <p-card styleClass="mt-3 preview-card">
    <ng-template pTemplate="title">معاينة حية</ng-template>
    <div class="preview-frame-wrap">
      @if (previewHtml(); as html) {
        <iframe class="preview-frame" [srcdoc]="html" title="معاينة تقرير المشروع"></iframe>
      } @else {
        <p class="text-color-secondary">جارٍ إنشاء المعاينة…</p>
      }
    </div>
  </p-card>
</div>
