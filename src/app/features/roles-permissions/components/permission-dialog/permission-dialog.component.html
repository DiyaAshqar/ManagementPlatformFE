<form [formGroup]="form" (ngSubmit)="onSubmit()" class="permission-dialog flex flex-column gap-3">
  @if (errorMessage()) {
    <p-message severity="error" [text]="errorMessage()!" styleClass="w-full"></p-message>
  }

  <div class="field">
    <label for="name">{{ 'rolesPermissions.permissions.dialog.name' | translate }}</label>
    <input
      pInputText
      id="name"
      formControlName="name"
      class="w-full"
      [placeholder]="'rolesPermissions.permissions.dialog.namePlaceholder' | translate" />
    @if (name.invalid && name.touched) {
      <small class="p-error block mt-1">{{ 'rolesPermissions.permissions.dialog.nameRequired' | translate }}</small>
    }
  </div>

  <div class="field">
    <label for="code">{{ 'rolesPermissions.permissions.dialog.code' | translate }}</label>
    <input
      pInputText
      id="code"
      formControlName="code"
      class="w-full"
      [placeholder]="'rolesPermissions.permissions.dialog.codePlaceholder' | translate" />
    @if (code.invalid && code.touched) {
      <small class="p-error block mt-1">{{ 'rolesPermissions.permissions.dialog.codeRequired' | translate }}</small>
    }
  </div>

  <div class="flex justify-content-end gap-2 mt-2">
    <p-button
      type="button"
      [label]="'common.cancel' | translate"
      [text]="true"
      (onClick)="onCancel()">
    </p-button>
    <p-button
      type="submit"
      [label]="(isEditMode ? 'common.update' : 'common.save') | translate"
      icon="pi pi-check"
      [loading]="loading()"
      [disabled]="loading()">
    </p-button>
  </div>
</form>
