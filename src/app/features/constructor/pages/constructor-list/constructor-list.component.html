<div class="constructor-list-container p-4">
  <!-- Header -->
  <div class="flex justify-content-between align-items-center mb-4">
    <div>
      <h1 class="text-3xl font-bold m-0">Constructors</h1>
      <p class="text-color-secondary mt-2">Manage main contractors and construction companies</p>
    </div>
    <p-button 
      label="Create Constructor"
      icon="pi pi-plus"
      (onClick)="createConstructor()"
      severity="primary"
      [raised]="true">
    </p-button>
  </div>

  <!-- Search Bar -->
  <div class="mb-4">
    <p-iconfield iconPosition="left" class="w-full md:w-4">
      <p-inputicon styleClass="pi pi-search"></p-inputicon>
      <input 
        type="text" 
        pInputText 
        [(ngModel)]="searchText"
        (ngModelChange)="onSearchChange()"
        placeholder="Search constructors..."
        class="w-full" />
    </p-iconfield>
  </div>

  <!-- Table -->
  <p-table 
    [value]="constructors()"
    [loading]="isLoading()"
    [paginator]="true"
    [rows]="pageSize"
    [totalRecords]="totalRecords"
    [lazy]="true"
    (onLazyLoad)="onPageChange($event)"
    [first]="first"
    [rowsPerPageOptions]="[10, 25, 50]"
    [showCurrentPageReport]="true"
    currentPageReportTemplate="Showing {first} to {last} of {totalRecords} constructors"
    styleClass="p-datatable-striped"
    [tableStyle]="{ 'min-width': '50rem' }">
    
    <ng-template pTemplate="header">
      <tr>
        <th style="width: 5rem">#</th>
        <th pSortableColumn="name">Name <p-sortIcon field="name"></p-sortIcon></th>
        <th>Contractor Type</th>
        <th style="width: 10rem">Actions</th>
      </tr>
    </ng-template>
    
    <ng-template pTemplate="body" let-constructor let-rowIndex="rowIndex">
      <tr>
        <td>{{ first + rowIndex + 1 }}</td>
        <td>{{ constructor.name || 'N/A' }}</td>
        <td>{{ getMainContractorTypeName(constructor.mainContractorTypeId) }}</td>
        <td>
          <div class="flex gap-2">
            <p-button 
              icon="pi pi-pencil"
              (onClick)="editConstructor(constructor)"
              [rounded]="true"
              [text]="true"
              severity="info"
              pTooltip="Edit"
              tooltipPosition="top">
            </p-button>
            <p-button 
              icon="pi pi-trash"
              (onClick)="deleteConstructor(constructor)"
              [rounded]="true"
              [text]="true"
              severity="danger"
              pTooltip="Delete"
              tooltipPosition="top">
            </p-button>
          </div>
        </td>
      </tr>
    </ng-template>
    
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="4" class="text-center py-4">
          <div class="flex flex-column align-items-center gap-3">
            <i class="pi pi-inbox text-4xl text-color-secondary"></i>
            <p class="text-color-secondary m-0">No constructors found</p>
            <p-button 
              label="Create First Constructor"
              icon="pi pi-plus"
              (onClick)="createConstructor()"
              severity="primary"
              [outlined]="true">
            </p-button>
          </div>
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>

<p-confirmDialog></p-confirmDialog>
<p-toast></p-toast>
